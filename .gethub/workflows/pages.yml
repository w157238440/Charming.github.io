# ==============================================================================
# GitHub Pages 自动部署
# ------------------------------------------------------------------------------
# 触发：push 到 main（或手动 Run workflow）
# 流程：checkout → 打包整个目录 → 上传 artifact → 发布到 Pages
#
# 前置条件（不做会失败）：
#   仓库 Settings → Pages → Build and deployment → Source 必须选 "GitHub Actions"
#   缺这一步会报：Get Pages site failed. Please verify that the repository has Pages enabled
#
# 本项目是纯静态站点，没有 build 步骤，所以 artifact 就是仓库根目录本身。
# 如果你的仓库里有不该发布的东西（草稿、原始设计稿），把 path 改成具体子目录，
# 或用 actions/upload-pages-artifact 的 path 配合一份 .gitignore 排除。
# ==============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 允许在 Actions 页面手动触发

# 同一时间只允许一个部署，新的 push 取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read            # 读仓库
  pages: write              # 发布 Pages
  id-token: write           # OIDC，用于向 Pages 证明身份

jobs:
  build:
    name: 打包站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点入口 index.html 在根目录，所以整目录打包
          path: "./CharmingLady"

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

